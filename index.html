<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊英語，開口就出發！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=centered-heading-5">
</head>

<body>

  <div class="app">

    <h1>旅遊英語，開口就出發！</h1>
    <p class="subtitle">每天學一點，旅行多一點自信 ✈️</p>

    <div class="tabs">
      <button onclick="showStudyMode()">📚 單字補給站</button>
      <button onclick="showQuizMode()">📝 單字小挑戰</button>
      <button onclick="showSpeakingMode()">🎤 開口練一練</button>
    </div>

    <!-- 單字學習區 -->
    <div id="studyMode">

      <div class="categories">
        <button onclick="changeCategory('airport')">✈️ 機場</button>
        <button onclick="changeCategory('hotel')">🏨 飯店</button>
        <button onclick="changeCategory('restaurant')">🍽️ 餐廳</button>
        <button onclick="changeCategory('shopping')">🛍️ 購物</button>
      </div>

      <div class="card">

        <p id="categoryName" class="category-name">✈️ 機場英文・準備起飛！</p>

        <button
          id="favoriteButton" aria-label="收進口袋" aria-pressed="false"
          class="favorite-button"
          onclick="toggleFavorite()"
        >
          <span aria-hidden="true">🤍</span><span class="favorite-label"> 收進口袋</span>
        </button>

        <h2 id="word">passport</h2>

        <p id="meaning" class="meaning">護照</p>

        <button onclick="playWord()">
          🔊 聽聽怎麼念
        </button>

        <hr>

        <h3 id="example">
          Please show me your passport.
        </h3>

        <p id="exampleMeaning">
          請出示你的護照。
        </p>

        <button onclick="playExample()">
          🔊 聽聽這一句
        </button>

        <p id="wordProgress" aria-live="polite"></p>
        <div class="navigation">
          <button onclick="previousWord()">← 複習上一個</button>
          <button onclick="nextWord()">再學一個 →</button>
        </div>

      </div>

      <div class="favorite-section">

        <h2>❤️ 我的單字口袋</h2>

        <button onclick="showFavorites()">
          打開單字口袋
        </button>

        <div id="favoriteList"></div>

      </div>

    </div>

    <!-- Quiz 測驗區 -->
    <div id="quizMode" class="hidden">

      <div class="quiz-card">

        <p class="quiz-label">這個單字是什麼意思？選一個試試！</p>

        <h2 id="quizWord">passport</h2>

        <div id="quizOptions" class="quiz-options"></div>

        <p id="quizResult"></p>

        <p id="score">
          答對題數：0 / 0
        </p>

        <button
          id="nextQuestionButton"
          onclick="nextQuestion()"
          class="hidden"
        >
          挑戰下一題 →
        </button>

      </div>

    </div>

    <!-- 口說練習區 -->
<div id="speakingMode" class="hidden">

  <div class="speaking-card">

    <p class="speaking-label">
      先聽一句，再勇敢跟著說！
    </p>

    <h2 id="speakingSentence">
      I'd like to check in.
    </h2>

    <p id="speakingMeaning">
      我想辦理入住。
    </p>

    <button onclick="playSpeakingSentence()">
      🔊 先聽怎麼說
    </button>

    <br>

    <button
      class="mic-button"
      onclick="startSpeakingPractice()"
    >
      🎤 換我說說看
    </button>

    <p id="listeningStatus">
      準備好了嗎？點麥克風，開口試試吧！
    </p>

    <div id="spokenResult"></div>

    <button onclick="nextSpeakingSentence()">
      再練一句 →
    </button>

  </div>

</div>

  <script src="app.js?v=category-labels-6"></script>

</body>
</html>
